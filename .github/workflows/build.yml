name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Get project version
      id: version
      run: |
        VERSION=$(grep -oP '(?<="version": ")[^"]*' package.json || echo "1.0.0")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create distribution directory
      run: mkdir -p dist

    - name: Copy files to dist
      run: |
        cp fxmanifest.lua dist/
        cp index.html dist/
        cp LICENSE dist/
        cp README.md dist/
        if [ -f music_yt.mp3 ]; then cp music_yt.mp3 dist/; fi
        if [ -f background.mp4 ]; then cp background.mp4 dist/; fi
        if [ -f logo.png ]; then cp logo.png dist/; fi

    - name: Create ZIP archive
      run: |
        cd dist
        zip -r ../maxii-loading-v${{ steps.version.outputs.version }}.zip .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: maxii-loading-v${{ steps.version.outputs.version }}
        path: dist/
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: maxii-loading-v${{ steps.version.outputs.version }}.zip
        body: MAXII STUDIO Loading Screen Release
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
