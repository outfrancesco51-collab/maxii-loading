<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAXII STUDIO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#020202;
font-family:'Poppins',sans-serif;
user-select:none
}

.video-wrapper{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:0;
overflow:hidden;
background:#020202
}

#bgVideo{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
object-position:center;
transform:scale(1.05);
filter:brightness(.42) contrast(1.12) saturate(0)
}

.dark-overlay{
position:fixed;
inset:0;
z-index:1;
pointer-events:none;
background:
radial-gradient(
circle at 50% 45%,
rgba(255,255,255,.045),
transparent 42%
),
linear-gradient(
to bottom,
rgba(0,0,0,.35) 0%,
rgba(0,0,0,.55) 50%,
rgba(0,0,0,.94) 100%
)
}

.vignette{
position:fixed;
inset:0;
z-index:2;
pointer-events:none;
box-shadow:inset 0 0 180px 45px rgba(0,0,0,.85)
}

#emberCanvas{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:3;
pointer-events:none;
opacity:.38
}

.stage{
position:absolute;
left:50%;
bottom:13%;
transform:translateX(-50%);
width:min(700px,90vw);
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
z-index:10;
animation:fadeIn .9s ease forwards
}

@keyframes fadeIn{
from{
opacity:0;
transform:translate(-50%,20px)
}
to{
opacity:1;
transform:translate(-50%,0)
}
}

.brand-logo{
display:block;
width:auto;
height:155px;
max-width:75vw;
object-fit:contain;
filter:
drop-shadow(0 0 18px rgba(255,255,255,.28))
drop-shadow(0 0 45px rgba(255,255,255,.10));
animation:logoPulse 4s ease-in-out infinite
}

.brand-logo.music-active{
animation:logoGlow 1.5s ease-in-out infinite;
}

@keyframes logoPulse{
0%,100%{
transform:scale(1);
filter:
drop-shadow(0 0 18px rgba(255,255,255,.25))
drop-shadow(0 0 42px rgba(255,255,255,.08))
}

50%{
transform:scale(1.025);
filter:
drop-shadow(0 0 25px rgba(255,255,255,.55))
drop-shadow(0 0 55px rgba(255,255,255,.18))
}
}

.brand-tag{
margin-top:12px;
color:rgba(255,255,255,.88);
font-size:12px;
font-weight:600;
letter-spacing:4px;
text-transform:uppercase;
text-shadow:0 2px 15px rgba(0,0,0,.9)
}

.status-badge{
margin-top:13px;
display:flex;
align-items:center;
gap:7px;
padding:6px 13px;
border:1px solid rgba(255,255,255,.25);
border-radius:999px;
background:rgba(255,255,255,.06);
color:#ffffff;
font-size:9px;
font-weight:700;
letter-spacing:1.6px;
text-transform:uppercase;
box-shadow:0 0 20px rgba(255,255,255,.04)
}

.status-dot{
width:6px;
height:6px;
border-radius:50%;
background:#ffffff;
box-shadow:0 0 8px rgba(255,255,255,.8);
animation:statusPulse 1.5s infinite
}

@keyframes statusPulse{
0%,100%{
opacity:1;
transform:scale(1)
}

50%{
opacity:.45;
transform:scale(.75)
}
}

@keyframes musicActive{
0%{
box-shadow:0 0 8px rgba(255,255,255,.3)
}
50%{
box-shadow:0 0 20px rgba(100,180,255,.8), 0 0 35px rgba(100,180,255,.4)
}
100%{
box-shadow:0 0 8px rgba(255,255,255,.3)
}
}

@keyframes logoGlow{
0%,100%{
filter:drop-shadow(0 0 18px rgba(255,255,255,.25)) drop-shadow(0 0 42px rgba(255,255,255,.08))
}
50%{
filter:drop-shadow(0 0 28px rgba(100,180,255,.5)) drop-shadow(0 0 60px rgba(100,180,255,.25))
}
}

.brand-tip{
margin-top:17px;
min-height:18px;
color:rgba(255,255,255,.72);
font-size:11px;
font-weight:500;
font-style:italic;
text-shadow:0 2px 10px rgba(0,0,0,.9);
transition:opacity .35s ease,transform .35s ease
}

.progress-block{
width:100%;
margin-top:30px
}

.progress-labels{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:8px
}

.progress-status{
color:rgba(255,255,255,.82);
font-size:10px;
font-weight:600;
letter-spacing:1.3px;
text-transform:uppercase
}

.progress-percent{
color:#ffffff;
font-size:11px;
font-weight:700;
letter-spacing:.5px
}

.progress-track{
position:relative;
width:100%;
height:3px;
overflow:hidden;
border-radius:10px;
background:rgba(255,255,255,.12);
box-shadow:0 0 15px rgba(0,0,0,.7)
}

.progress-fill{
position:relative;
width:0%;
height:100%;
border-radius:10px;
background:linear-gradient(
90deg,
#555555,
#ffffff,
#aaaaaa
);
box-shadow:0 0 12px rgba(255,255,255,.5);
transition:width 0.5s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease
}

.progress-fill.music-active{
animation:musicActive 1.5s ease-in-out infinite;
}

.progress-fill::after{
content:"";
position:absolute;
top:0;
left:-50%;
width:50%;
height:100%;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.9),
transparent
);
animation:shimmer 1.7s infinite
}

@keyframes shimmer{
from{
left:-50%
}

to{
left:150%
}
}

.progress-fill.complete{
background:linear-gradient(
90deg,
#888888,
#ffffff,
#dddddd
);
box-shadow:0 0 35px rgba(255,255,255,.9), 0 0 15px rgba(255,255,255,.6)
}

.footer{
position:fixed;
left:50%;
bottom:28px;
transform:translateX(-50%);
width:min(700px,90vw);
z-index:20;
display:flex;
align-items:center;
justify-content:space-between;
padding-top:14px;
border-top:1px solid rgba(255,255,255,.09)
}

.discord-link{
display:flex;
align-items:center;
gap:8px;
color:rgba(255,255,255,.7);
font-size:10px;
font-weight:700;
letter-spacing:1.5px;
text-transform:uppercase;
text-decoration:none;
cursor:pointer;
transition:color .2s ease,transform .2s ease
}

.discord-link:hover{
color:#ffffff;
transform:translateY(-1px)
}

.discord-link svg{
width:15px;
height:15px;
fill:currentColor
}

.volume{
display:flex;
align-items:center;
gap:12px
}

.music-controls-group {
display:flex;
align-items:center;
gap:6px;
}

.icon-music-btn {
display:flex;
align-items:center;
justify-content:center;
width:24px;
height:24px;
padding:0;
border:1px solid rgba(255,255,255,.28);
border-radius:6px;
background:rgba(255,255,255,.06);
color:#ffffff;
cursor:pointer;
transition:all .2s ease;
}

.icon-music-btn:hover {
background:rgba(255,255,255,.12);
border-color:rgba(255,255,255,.65);
box-shadow:0 0 12px rgba(255,255,255,.12);
transform:translateY(-1px);
}

.icon-music-btn svg {
width:12px;
height:12px;
fill:currentColor;
}

.music-button{
display:flex;
align-items:center;
justify-content:center;
min-width:50px;
height:24px;
padding:0 10px;
border:1px solid rgba(255,255,255,.28);
border-radius:6px;
background:rgba(255,255,255,.06);
color:#ffffff;
font-family:'Poppins',sans-serif;
font-size:8px;
font-weight:700;
letter-spacing:1px;
cursor:pointer;
transition:
background .2s ease,
border-color .2s ease,
transform .2s ease,
box-shadow .2s ease
}

.music-button:hover{
background:rgba(255,255,255,.12);
border-color:rgba(255,255,255,.65);
box-shadow:0 0 12px rgba(255,255,255,.12);
transform:translateY(-1px)
}

.volume-icon{
display:flex;
align-items:center;
justify-content:center;
width:22px;
height:22px;
padding:0;
border:none;
background:transparent;
color:rgba(255,255,255,.65);
cursor:default
}

.volume-icon svg{
width:15px;
height:15px;
fill:currentColor
}

input[type="range"]{
appearance:none;
-webkit-appearance:none;
width:75px;
height:4px;
border-radius:10px;
background:linear-gradient(to right, #ffffff 15%, rgba(255,255,255,.2) 15%);
outline:none;
cursor:pointer;
box-shadow:inset 0 0 4px rgba(0,0,0,.4);
}

input[type="range"]::-webkit-slider-thumb{
appearance:none;
-webkit-appearance:none;
width:11px;
height:11px;
border-radius:50%;
background:#ffffff;
box-shadow:0 0 12px rgba(255,255,255,.8), inset 0 -2px 4px rgba(0,0,0,.3);
cursor:grab;
transition:transform .1s ease;
}

input[type="range"]::-webkit-slider-thumb:active{
cursor:grabbing;
transform:scale(1.15);
}

input[type="range"]::-webkit-slider-runnable-track{
background:transparent;
height:3px;
border-radius:10px;
}
.language-selector{
position:fixed;
top:20px;
right:20px;
z-index:30;
}

.language-selector select{
padding:8px 14px;
border:1px solid rgba(255,255,255,.28);
border-radius:6px;
background:rgba(255,255,255,.06);
color:#ffffff;
font-family:'Poppins',sans-serif;
font-size:10px;
font-weight:600;
letter-spacing:1px;
cursor:pointer;
-webkit-backdrop-filter:blur(6px);
backdrop-filter:blur(6px);
transition:all .2s ease;
box-shadow:0 0 15px rgba(0,0,0,.5);
}

.language-selector select:hover{
background:rgba(255,255,255,.12);
border-color:rgba(255,255,255,.65);
box-shadow:0 0 20px rgba(255,255,255,.15);
}

.language-selector select:focus{
outline:none;
background:rgba(255,255,255,.15);
border-color:rgba(255,255,255,.8);
box-shadow:0 0 25px rgba(255,255,255,.25);
}

.language-selector select option{
background:#0a0a0a;
color:#ffffff;
padding:12px 10px;
font-size:10px;
font-weight:600;
border:none;
line-height:1.6;
margin:0;
border-bottom:1px solid rgba(255,255,255,.08);
}

.language-selector select option:last-child{
border-bottom:none;
}

.language-selector select option:hover{
background:#1a3a5f;
}

.language-selector select option:checked{
background:#2563eb;
color:#ffffff;
font-weight:700;
}

/* Firefox */
@-moz-document url-prefix() {
.language-selector select{
background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
background-repeat:no-repeat;
background-position:right 8px center;
background-size:16px;
padding-right:35px;
}
}


input[type="range"]::-moz-range-thumb{
width:11px;
height:11px;
border:none;
border-radius:50%;
background:#ffffff;
box-shadow:0 0 12px rgba(255,255,255,.8), inset 0 -2px 4px rgba(0,0,0,.3);
cursor:grab;
}

input[type="range"]::-moz-range-track{
background:rgba(255,255,255,.2);
border:none;
height:4px;
border-radius:10px;
}

input[type="range"]::-moz-range-progress{
background:#ffffff;
height:4px;
border-radius:10px;
}

.vol-indicator{
width:30px;
color:rgba(255,255,255,.5);
font-size:9px;
font-weight:600;
text-align:right
}

.corner-tag{
position:fixed;
left:20px;
bottom:18px;
z-index:20;
color:rgba(255,255,255,.3);
font-size:9px;
font-weight:700;
letter-spacing:2px
}

@media(max-width:700px){

.stage{
bottom:17%;
width:88vw
}

.brand-logo{
height:100px
}

.brand-tag{
font-size:9px;
letter-spacing:2px
}

.brand-tip{
font-size:10px
}

.footer{
width:88vw;
bottom:20px
}

.corner-tag{
display:none
}

.volume{
gap:7px
}

.music-button{
min-width:48px;
padding:0 8px
}

input[type="range"]{
width:65px
}

}
</style>
</head>

<script>

const video=document.getElementById("bgVideo");
const music=document.getElementById("bgMusic");
const volumeSlider=document.getElementById("volumeSlider");
const volumeValue=document.getElementById("volumeValue");
const muteBtn=document.getElementById("muteBtn");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const musicButtonText=document.getElementById("musicButtonText");
const languageSelect=document.getElementById("languageSelect");
const brandTag=document.getElementById("brandTag");
const brandLogo=document.querySelector(".brand-logo");
const volumeIcon=document.querySelector(".volume-icon svg path");

const progressBar=document.getElementById("loadProgress");
const progressPercent=document.getElementById("loadPercent");
const statusText=document.getElementById("loadStatus");
const tipText=document.getElementById("loadTip");

let currentLanguage="it";

console.log("brandLogo element:", brandLogo);
console.log("progressBar element:", progressBar);

video.volume=0;

function startVideo(){

video.play().catch(()=>{

setTimeout(()=>{

video.play().catch(()=>{});

},1000);

});

}

startVideo();

let musicStarted=false;
let musicStoppedByUser=false;

music.volume=.15;

function startMusic(){

if(musicStoppedByUser)return;
if(!music.paused)return;

music.muted=false;

music.play().then(()=>{

musicStarted=true;
musicButtonText.textContent="STOP";
progressBar.classList.add("music-active");
if(brandLogo){
brandLogo.classList.add("music-active");
}

console.log("Music started, effects applied");

}).catch((error)=>{

musicStarted=false;
console.log("Music play failed:", error);

});

}

startMusic();

document.addEventListener("click",()=>{

if(!musicStoppedByUser&&music.paused){
startMusic();
}

});

document.addEventListener("keydown",()=>{

if(!musicStoppedByUser&&music.paused){
startMusic();
}

});

document.addEventListener("mousemove",()=>{

if(!musicStoppedByUser&&music.paused){
startMusic();
}

});

muteBtn.addEventListener("click",event=>{

event.stopPropagation();

if(music.paused){

musicStoppedByUser=false;
music.muted=false;

if(Number(volumeSlider.value)===0){

volumeSlider.value=15;
music.volume=.15;
volumeValue.textContent="15%";

}

music.play().then(()=>{

musicStarted=true;
musicButtonText.textContent="STOP";
progressBar.classList.add("music-active");
if(brandLogo){
brandLogo.classList.add("music-active");
}

console.log("Music started via mute button");

}).catch(()=>{});

}else{

music.pause();
music.muted=true;
musicStarted=false;
musicStoppedByUser=true;
musicButtonText.textContent="PLAY";
progressBar.classList.remove("music-active");
if(brandLogo){
brandLogo.classList.remove("music-active");
}

console.log("Music stopped via mute button");

}

});

volumeSlider.addEventListener("input",function(){

const value=Number(this.value);
this.style.background = `linear-gradient(to right, #ffffff ${value}%, rgba(255,255,255,.2) ${value}%)`;

music.volume=value/100;
volumeValue.textContent=value+"%";

if(value===0){

music.muted=true;
music.pause();
musicStoppedByUser=true;
musicButtonText.textContent="PLAY";
progressBar.classList.remove("music-active");
if(brandLogo){
brandLogo.classList.remove("music-active");
}
volumeIcon.setAttribute("d","M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C23.16 14.49 24 12.86 24 11c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z");

}else{

music.muted=false;
musicStoppedByUser=false;

if(!music.paused){
musicButtonText.textContent="STOP";
progressBar.classList.add("music-active");
if(brandLogo){
brandLogo.classList.add("music-active");

const playlist = [
  "music_yt.mp3"
  // Aggiungi altre tracce qui, es: "track2.mp3", "track3.mp3"
];
let currentTrackIndex = 0;

function changeMusic(direction) {
  if (direction === 'next') {
    currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
  } else {
    currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
  }
  
  const wasPlaying = !music.paused;
  music.src = playlist[currentTrackIndex];
  
  if (wasPlaying || musicStarted) {
    music.play().catch(()=>{});
  } else if (!musicStoppedByUser) {
    startMusic();
  }
}

if (prevBtn) {
  prevBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    changeMusic('prev');
  });
}

if (nextBtn) {
  nextBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    changeMusic('next');
  });
}

let isLoaded = false;

function animateValue(obj, start, end, duration) {
let startTimestamp = null;
const step = (timestamp) => {
if (!startTimestamp) startTimestamp = timestamp;
const p = Math.min((timestamp - startTimestamp) / duration, 1);
const ease = 1 - Math.pow(1 - p, 4);
obj.textContent = Math.floor(ease * (end - start) + start) + "%";
if (p < 1) window.requestAnimationFrame(step);
};
window.requestAnimationFrame(step);
}

function simulateLoading() {

const canvas=document.getElementById("emberCanvas");
const ctx=canvas.getContext("2d");

let particles=[];

function resizeCanvas(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize",resizeCanvas);

class Particle{

constructor(){
this.reset(true);
}

reset(initial=false){

this.x=Math.random()*canvas.width;

this.y=initial
?Math.random()*canvas.height
:canvas.height+10;

this.size=Math.random()*1.4+.3;

this.speed=Math.random()*.35+.08;

this.drift=(Math.random()-.5)*.15;

this.alpha=Math.random()*.4+.1;

}

update(){

this.y-=this.speed;
this.x+=this.drift;

if(this.y<-10){
this.reset();
}

}

draw(){

ctx.beginPath();

ctx.arc(
this.x,
this.y,
this.size,
0,
Math.PI*2
);

ctx.fillStyle=
`rgba(255,255,255,${this.alpha})`;

ctx.fill();

}

}

for(let i=0;i<45;i++){
particles.push(new Particle());
}

function particleLoop(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

for(const particle of particles){

particle.update();
particle.draw();

}

requestAnimationFrame(particleLoop);

}

particleLoop();
